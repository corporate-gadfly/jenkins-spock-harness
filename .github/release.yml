changelog:
  categories:
    - title: "🚀 New Features"
      labels:
        - "feature"

    - title: "⚙️ Enhancements"
      labels:
        - "enhancement"
        - "improvement"
        - "performance"

    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
        - "fix"

    - title: "📦 Dependencies"
      labels:
        - "dependencies"

    - title: "🔄 Other Changes"
      labels:
        - "*"

  exclude:
    labels:
      - "duplicate"
      - "wontfix"
      - "invalid"
      - "chore"
    authors:
      - "dependabot[bot]"
